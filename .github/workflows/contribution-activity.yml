name: Update Contribution Activity

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-contribution-graph:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution SVG
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const fs = require("fs");

            const username = "Bidisha03Biswas";

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                          date
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username
            });

            const calendar =
              result.user.contributionsCollection.contributionCalendar;

            const weeks = calendar.weeks;

            const width = 1200;
            const height = 310;

            const cellSize = 18;
            const gap = 5;

            const left = 85;
            const top = 105;

            const colors = [
              "#000000",
              "#e9d5ff",
              "#c084fc",
              "#9333ea",
              "#6d28d9"
            ];

            const allDays = weeks.flatMap(
              week => week.contributionDays
            );

            const maxContribution = Math.max(
              ...allDays.map(day => day.contributionCount),
              1
            );

            function getLevel(count) {

              if (count === 0) {
                return 0;
              }

              const ratio = count / maxContribution;

              if (ratio <= 0.25) {
                return 1;
              }

              if (ratio <= 0.50) {
                return 2;
              }

              if (ratio <= 0.75) {
                return 3;
              }

              return 4;
            }

            function escapeXML(text) {
              return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");
            }

            let svg = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="${width}"
              height="${height}"
              viewBox="0 0 ${width} ${height}"
            >

              <defs>

                <linearGradient
                  id="purpleGradient"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="0%"
                >
                  <stop
                    offset="0%"
                    stop-color="#c084fc"
                  />

                  <stop
                    offset="50%"
                    stop-color="#9333ea"
                  />

                  <stop
                    offset="100%"
                    stop-color="#6d28d9"
                  />

                </linearGradient>

              </defs>

              <!-- Background -->

              <rect
                x="0"
                y="0"
                width="${width}"
                height="${height}"
                rx="18"
                fill="#000000"
              />

              <!-- Border -->

              <rect
                x="2"
                y="2"
                width="${width - 4}"
                height="${height - 4}"
                rx="16"
                fill="none"
                stroke="#6d5cae"
                stroke-width="2"
              />

              <!-- Heading -->

              <text
                x="32"
                y="52"
                fill="#f5f5f5"
                font-family="Arial, Helvetica, sans-serif"
                font-size="30"
                font-weight="700"
              >
                📊 Contribution Activity
              </text>

              <line
                x1="32"
                y1="75"
                x2="${width - 32}"
                y2="75"
                stroke="#333333"
                stroke-width="1"
              />

              <!-- Journey heading -->

              <text
                x="${width / 2}"
                y="105"
                text-anchor="middle"
                fill="#f5f5f5"
                font-family="Arial, Helvetica, sans-serif"
                font-size="22"
                font-weight="700"
              >
                💜 My GitHub Journey
              </text>
            `;

            /*
             * Month labels
             */

            const months = new Set();

            weeks.forEach((week, weekIndex) => {

              const firstDay = week.contributionDays[0];

              if (!firstDay) return;

              const date = new Date(firstDay.date);

              const month = date.toLocaleString(
                "en-US",
                {
                  month: "short",
                  timeZone: "UTC"
                }
              );

              const monthKey =
                date.getUTCFullYear() + "-" +
                date.getUTCMonth();

              if (!months.has(monthKey)) {

                months.add(monthKey);

                const x =
                  left +
                  weekIndex * (cellSize + gap);

                svg += `
                  <text
                    x="${x}"
                    y="137"
                    fill="#d1d1d1"
                    font-family="Arial, Helvetica, sans-serif"
                    font-size="15"
                  >
                    ${month}
                  </text>
                `;
              }
            });

            /*
             * Weekday labels
             */

            svg += `
              <text
                x="35"
                y="${top + 18}"
                fill="#bdbdbd"
                font-family="Arial, Helvetica, sans-serif"
                font-size="13"
              >
                Mon
              </text>

              <text
                x="35"
                y="${top + 3 * (cellSize + gap) + 18}"
                fill="#bdbdbd"
                font-family="Arial, Helvetica, sans-serif"
                font-size="13"
              >
                Wed
              </text>

              <text
                x="35"
                y="${top + 5 * (cellSize + gap) + 18}"
                fill="#bdbdbd"
                font-family="Arial, Helvetica, sans-serif"
                font-size="13"
              >
                Fri
              </text>
            `;

            /*
             * Contribution cells
             */

            weeks.forEach((week, weekIndex) => {

              week.contributionDays.forEach(day => {

                const date = new Date(day.date);

                const jsDay = date.getUTCDay();

                /*
                 * Convert Sunday=0 to GitHub-style
                 * Sunday at bottom.
                 */

                const row =
                  jsDay === 0 ? 6 : jsDay - 1;

                const x =
                  left +
                  weekIndex * (cellSize + gap);

                const y =
                  top +
                  row * (cellSize + gap);

                const level =
                  getLevel(day.contributionCount);

                const fill =
                  colors[level];

                svg += `
                  <rect
                    x="${x}"
                    y="${y}"
                    width="${cellSize}"
                    height="${cellSize}"
                    rx="2"
                    fill="${fill}"
                    stroke="#ffffff"
                    stroke-width="1"
                  />
                `;
              });
            });

            /*
             * Legend
             */

            const legendY = 260;

            svg += `
              <text
                x="455"
                y="${legendY + 5}"
                fill="#eeeeee"
                font-family="Arial, Helvetica, sans-serif"
                font-size="14"
              >
                Less
              </text>
            `;

            for (let i = 0; i < 5; i++) {

              const x =
                505 + i * 28;

              svg += `
                <rect
                  x="${x}"
                  y="${legendY - 10}"
                  width="18"
                  height="18"
                  rx="2"
                  fill="${colors[i]}"
                  stroke="#ffffff"
                  stroke-width="1"
                />
              `;
            }

            svg += `
              <text
                x="650"
                y="${legendY + 5}"
                fill="#eeeeee"
                font-family="Arial, Helvetica, sans-serif"
                font-size="14"
              >
                More
              </text>

              <line
                x1="32"
                y1="280"
                x2="${width - 32}"
                y2="280"
                stroke="#333333"
                stroke-width="1"
              />

              <text
                x="${width / 2}"
                y="300"
                text-anchor="middle"
                fill="#eeeeee"
                font-family="Arial, Helvetica, sans-serif"
                font-size="15"
                font-weight="700"
              >
                Building
                <tspan fill="#a855f7"> • </tspan>
                Learning
                <tspan fill="#a855f7"> • </tspan>
                Experimenting
                <tspan fill="#a855f7"> • </tspan>
                Improving
              </text>

            </svg>
            `;

            fs.mkdirSync("assets", {
              recursive: true
            });

            fs.writeFileSync(
              "assets/contribution-activity.svg",
              svg
            );

      - name: Commit Contribution Graph
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-activity.svg

          git diff --cached --quiet || \
            git commit -m "Update contribution activity"

          git push
