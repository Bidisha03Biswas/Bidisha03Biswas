name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Bidisha03Biswas
          cards: contributions
          output-dir: assets
          themes: dark
          commit: true
          commit-message: "chore: update GitHub contribution card"
