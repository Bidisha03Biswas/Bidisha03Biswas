name: Update Contribution Activity

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-contribution-graph:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Graph
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const fs = require("fs");

            const username = "Bidisha03Biswas";

            const query = `
              query($login: String!) {

                user(login: $login) {

                  contributionsCollection {

                    contributionCalendar {

                      totalContributions

                      weeks {

                        contributionDays {
                          contributionCount
                          date
                        }

                      }

                    }

                  }

                }

              }
            `;

            const result = await github.graphql(query, {
              login: username
            });

            const calendar =
              result.user.contributionsCollection
                .contributionCalendar;

            const weeks = calendar.weeks;

            /*
             * ==========================================================
             * CANVAS
             * ==========================================================
             */

            const width = 1200;
            const height = 390;

            /*
             * Contribution grid
             */

            const cell = 15;
            const gap = 4;

            const gridWidth =
              weeks.length * (cell + gap);

            const left =
              Math.max(
                70,
                Math.floor(
                  (width - gridWidth) / 2
                )
              );

            const top = 150;

            /*
             * ==========================================================
             * COLORS
             * ==========================================================
             */

            const colors = [
              "#000000",
              "#e9d5ff",
              "#c084fc",
              "#9333ea",
              "#6d28d9"
            ];

            /*
             * ==========================================================
             * MAX CONTRIBUTIONS
             * ==========================================================
             */

            const allDays =
              weeks.flatMap(
                week => week.contributionDays
              );

            const maxContribution =
              Math.max(
                ...allDays.map(
                  day => day.contributionCount
                ),
                1
              );

            /*
             * ==========================================================
             * CONTRIBUTION LEVEL
             * ==========================================================
             */

            function getLevel(count) {

              if (count === 0)
                return 0;

              const ratio =
                count / maxContribution;

              if (ratio <= 0.20)
                return 1;

              if (ratio <= 0.45)
                return 2;

              if (ratio <= 0.70)
                return 3;

              return 4;
            }

            /*
             * ==========================================================
             * SVG
             * ==========================================================
             */

            let svg = `

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="${width}"
              height="${height}"
              viewBox="0 0 ${width} ${height}"
            >

              <!-- BACKGROUND -->

              <rect
                width="${width}"
                height="${height}"
                rx="18"
                fill="#000000"
              />

              <!-- OUTER BORDER -->

              <rect
                x="2"
                y="2"
                width="${width - 4}"
                height="${height - 4}"
                rx="16"
                fill="none"
                stroke="#6d5cae"
                stroke-width="2"
              />

              <!-- =====================================================
                   MAIN TITLE
                   ===================================================== -->

              <text
                x="30"
                y="48"
                fill="#f5f5f5"
                font-family="Arial, Helvetica, sans-serif"
                font-size="29"
                font-weight="700"
              >
                📊 Contribution Activity
              </text>

              <line
                x1="30"
                y1="68"
                x2="${width - 30}"
                y2="68"
                stroke="#333333"
                stroke-width="1"
              />

              <!-- =====================================================
                   JOURNEY TITLE
                   ===================================================== -->

              <text
                x="${width / 2}"
                y="105"
                text-anchor="middle"
                fill="#f5f5f5"
                font-family="Arial, Helvetica, sans-serif"
                font-size="22"
                font-weight="700"
              >
                💜 My GitHub Journey
              </text>

            `;

            /*
             * ==========================================================
             * MONTH LABELS
             * ==========================================================
             *
             * Detect every month appearing in the calendar.
             */

            const displayedMonths = new Set();

            weeks.forEach(
              (week, weekIndex) => {

                week.contributionDays.forEach(
                  day => {

                    const date =
                      new Date(day.date);

                    const key =
                      `${date.getUTCFullYear()}-${date.getUTCMonth()}`;

                    if (
                      !displayedMonths.has(key)
                    ) {

                      displayedMonths.add(key);

                      const month =
                        date.toLocaleString(
                          "en-US",
                          {
                            month: "short",
                            timeZone: "UTC"
                          }
                        );

                      const x =
                        left +
                        weekIndex *
                        (cell + gap);

                      svg += `

                        <text
                          x="${x}"
                          y="133"
                          fill="#cfcfcf"
                          font-family="Arial, Helvetica, sans-serif"
                          font-size="14"
                          font-weight="500"
                        >
                          ${month}
                        </text>

                      `;

                    }

                  }
                );

              }
            );

            /*
             * ==========================================================
             * WEEKDAY LABELS
             * ==========================================================
             */

            svg += `

              <text
                x="25"
                y="${top + 15}"
                fill="#a9a9a9"
                font-family="Arial, Helvetica, sans-serif"
                font-size="12"
              >
                Mon
              </text>

              <text
                x="25"
                y="${top + 3 * (cell + gap) + 15}"
                fill="#a9a9a9"
                font-family="Arial, Helvetica, sans-serif"
                font-size="12"
              >
                Wed
              </text>

              <text
                x="25"
                y="${top + 5 * (cell + gap) + 15}"
                fill="#a9a9a9"
                font-family="Arial, Helvetica, sans-serif"
                font-size="12"
              >
                Fri
              </text>

            `;

            /*
             * ==========================================================
             * CONTRIBUTION CELLS
             * ==========================================================
             */

            weeks.forEach(
              (week, weekIndex) => {

                week.contributionDays.forEach(
                  day => {

                    const date =
                      new Date(day.date);

                    /*
                     * Sunday = 0
                     * Monday = 1
                     * ...
                     * Saturday = 6
                     */

                    const sundayBased =
                      date.getUTCDay();

                    const row =
                      sundayBased === 0
                        ? 6
                        : sundayBased - 1;

                    const x =
                      left +
                      weekIndex *
                      (cell + gap);

                    const y =
                      top +
                      row *
                      (cell + gap);

                    const level =
                      getLevel(
                        day.contributionCount
                      );

                    const fill =
                      colors[level];

                    svg += `

                      <rect
                        x="${x}"
                        y="${y}"
                        width="${cell}"
                        height="${cell}"
                        rx="2"
                        fill="${fill}"
                        stroke="#ffffff"
                        stroke-width="1"
                      />

                    `;

                  }
                );

              }
            );

            /*
             * ==========================================================
             * LEGEND
             * ==========================================================
             */

            const legendY = 325;

            svg += `

              <text
                x="440"
                y="${legendY + 5}"
                fill="#eeeeee"
                font-family="Arial, Helvetica, sans-serif"
                font-size="14"
              >
                Less
              </text>

            `;

            colors.forEach(
              (color, index) => {

                const x =
                  490 +
                  index * 30;

                svg += `

                  <rect
                    x="${x}"
                    y="${legendY - 10}"
                    width="18"
                    height="18"
                    rx="2"
                    fill="${color}"
                    stroke="#ffffff"
                    stroke-width="1"
                  />

                `;

              }
            );

            svg += `

              <text
                x="650"
                y="${legendY + 5}"
                fill="#eeeeee"
                font-family="Arial, Helvetica, sans-serif"
                font-size="14"
              >
                More
              </text>

              <!-- =====================================================
                   FOOTER DIVIDER
                   ===================================================== -->

              <line
                x1="30"
                y1="355"
                x2="${width - 30}"
                y2="355"
                stroke="#333333"
                stroke-width="1"
              />

              <!-- =====================================================
                   FOOTER
                   ===================================================== -->

              <text
                x="${width / 2}"
                y="378"
                text-anchor="middle"
                fill="#eeeeee"
                font-family="Arial, Helvetica, sans-serif"
                font-size="15"
                font-weight="700"
              >

                Building

                <tspan fill="#a855f7">
                  •
                </tspan>

                Learning

                <tspan fill="#a855f7">
                  •
                </tspan>

                Experimenting

                <tspan fill="#a855f7">
                  •
                </tspan>

                Improving

              </text>

            </svg>
            `;

            /*
             * ==========================================================
             * SAVE FILE
             * ==========================================================
             */

            fs.mkdirSync(
              "assets",
              {
                recursive: true
              }
            );

            fs.writeFileSync(
              "assets/contribution-activity.svg",
              svg
            );

      - name: Commit Updated Graph
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-activity.svg

          git diff --cached --quiet || \
            git commit \
            -m "Update contribution activity"

          git push
